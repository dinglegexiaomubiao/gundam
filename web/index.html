<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0f14">
  <title>GGE 资料库</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="#main" class="skip-link">跳转到主内容</a>
  <div id="aria-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <div class="logo-inner">GGE</div>
        <div class="logo-scan"></div>
      </div>
      <div class="brand-text">
        <h1 class="title">资料库</h1>
        <div class="sub">SD 高达 G 世纪永恒 · 机体 / 驾驶员 / 支援 / 关卡</div>
      </div>
      <div class="hud-status" id="hudStatus" title="系统状态">
        <span class="hud-dot" aria-hidden="true"></span>
        <span class="hud-label">SYSTEM ONLINE</span>
        <span class="hud-sep" aria-hidden="true">·</span>
        <span class="hud-time" id="hudTime">--:--:--</span>
        <span class="hud-sep" aria-hidden="true">·</span>
        <span class="hud-dbstat" id="hudDbStat">加载中…</span>
      </div>
    </div>
    <nav id="tabs" role="tablist">
      <button data-tab="overview"   class="active" role="tab" aria-selected="true" data-tab-color="hud-blue">概览</button>
      <button data-tab="units"      role="tab" aria-selected="false" data-tab-color="hud-red">机体</button>
      <button data-tab="characters" role="tab" aria-selected="false" data-tab-color="hud-blue">驾驶员</button>
      <button data-tab="supporters" role="tab" aria-selected="false" data-tab-color="hud-amber">支援角色</button>
      <button data-tab="stages"     role="tab" aria-selected="false" data-tab-color="hud-green">关卡敌人</button>
      <button data-tab="search"     role="tab" aria-selected="false" data-tab-color="role2">技能/能力/效果</button>
      <button data-tab="damage"     role="tab" aria-selected="false" data-tab-color="hud-amber">伤害计算</button>
      <button data-tab="pairing"    role="tab" aria-selected="false" data-tab-color="hud-green">配对</button>
    </nav>
    <div class="hud-light-bar" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>
  </header>

  <main id="main">
    <section id="tab-overview" class="tab active" role="tabpanel" aria-label="概览"></section>

    <section id="tab-units" class="tab" role="tabpanel" aria-label="机体">
      <div class="toolbar">
        <input id="unit-q" placeholder="搜索机体名称…" aria-label="搜索机体名称">
        <select id="unit-rarity" aria-label="稀有度筛选">
          <option value="">全部稀有度</option>
          <option value="5">UR</option>
          <option value="4">SSR</option>
          <option value="3">SR</option>
          <option value="2">R</option>
          <option value="1">N</option>
        </select>
        <select id="unit-acq" aria-label="获取途径筛选">
          <option value="">全部获取途径</option>
          <option value="1">扭蛋</option>
          <option value="other">其他</option>
        </select>
        <div class="sbox" id="unit-series-box">
          <input class="sbox-input" placeholder="搜索系列…" autocomplete="off" aria-label="搜索系列">
          <div class="sbox-list hidden"></div>
          <button class="sbox-clear hidden" type="button" title="清除" aria-label="清除系列筛选">×</button>
        </div>
        <select id="unit-type" aria-label="类型筛选">
          <option value="">全部类型</option>
          <option value="1">攻击型</option>
          <option value="2">耐久型</option>
          <option value="3">支援型</option>
        </select>
        <div class="sbox" id="unit-tag-box">
          <input class="sbox-input" placeholder="搜索/添加标签…" autocomplete="off" aria-label="搜索或添加标签">
          <div class="sbox-list hidden"></div>
        </div>
        <select id="unit-tag-mode" aria-label="标签匹配模式">
          <option value="all">含全部标签</option>
          <option value="any">含任一标签</option>
        </select>
        <select id="unit-match" aria-label="筛选条件匹配模式">
          <option value="and">交集（全部满足）</option>
          <option value="or">并集（任一满足）</option>
        </select>
        <div class="sbox" id="unit-wfx-box">
          <input class="sbox-input" placeholder="搜索/添加武器特效…" autocomplete="off" aria-label="搜索或添加武器特效">
          <div class="sbox-list hidden"></div>
        </div>
        <select id="unit-wfx-mode" aria-label="武器特效匹配模式">
          <option value="any" selected>含任一特效</option>
          <option value="all">含全部特效</option>
        </select>
        <button id="unit-search">查询</button>
        <button id="unit-reset" class="reset-btn" title="重置筛选">重置</button>
      </div>
      <div id="unit-tag-chips" class="tagbar"></div>
      <div id="unit-wfx-chips" class="tagbar"></div>
      <div id="unit-cond-bar" class="tagbar"></div>
      <div id="unit-count" class="result-count"></div>
      <div class="list-head units">
        <span><button class="sort-th" data-kind="units" data-sort="name">名称</button></span>
        <span><button class="sort-th" data-kind="units" data-sort="rarity">稀有度</button></span>
        <span><button class="sort-th" data-kind="units" data-sort="role">类型</button></span>
        <span><button class="sort-th" data-kind="units" data-sort="attack">攻击</button></span>
        <span><button class="sort-th" data-kind="units" data-sort="defense">防御</button></span>
        <span><button class="sort-th" data-kind="units" data-sort="mobility">机动</button></span>
        <span><button class="sort-th" data-kind="units" data-sort="hp">HP</button></span>
        <span><button class="sort-th" data-kind="units" data-sort="en">EN</button></span>
        <span><button class="sort-th" data-kind="units" data-sort="movement">移动</button></span>
      </div>
      <div id="unit-list" class="list units"></div>
      <div id="unit-pager" class="pager"></div>
    </section>

    <section id="tab-characters" class="tab" role="tabpanel" aria-label="驾驶员">
      <div class="toolbar">
        <input id="char-q" placeholder="搜索驾驶员名称…" aria-label="搜索驾驶员名称">
        <select id="char-rarity" aria-label="稀有度筛选">
          <option value="">全部稀有度</option>
          <option value="5">UR</option>
          <option value="4">SSR</option>
          <option value="3">SR</option>
          <option value="2">R</option>
          <option value="1">N</option>
        </select>
        <div class="sbox" id="char-series-box">
          <input class="sbox-input" placeholder="搜索系列…" autocomplete="off" aria-label="搜索系列">
          <div class="sbox-list hidden"></div>
          <button class="sbox-clear hidden" type="button" title="清除" aria-label="清除系列筛选">×</button>
        </div>
        <select id="char-type" aria-label="类型筛选">
          <option value="">全部类型</option>
          <option value="1">攻击型</option>
          <option value="2">耐久型</option>
          <option value="3">支援型</option>
        </select>
        <div class="sbox" id="char-tag-box">
          <input class="sbox-input" placeholder="搜索/添加标签…" autocomplete="off" aria-label="搜索或添加标签">
          <div class="sbox-list hidden"></div>
        </div>
        <select id="char-tag-mode" aria-label="标签匹配模式">
          <option value="all">含全部标签</option>
          <option value="any">含任一标签</option>
        </select>
        <div class="sbox" id="char-skill-box">
          <input class="sbox-input" placeholder="搜索/添加人物技能…" autocomplete="off" aria-label="搜索或添加人物技能">
          <div class="sbox-list hidden"></div>
        </div>
        <select id="char-skill-mode" aria-label="技能匹配模式">
          <option value="any" selected>含任一技能</option>
          <option value="all">含全部技能</option>
        </select>
        <select id="char-support" aria-label="支援次数筛选"><option value="">全部支援次数</option></select>
        <select id="char-match" aria-label="筛选条件匹配模式">
          <option value="and">交集（全部满足）</option>
          <option value="or">并集（任一满足）</option>
        </select>
        <button id="char-search">查询</button>
        <button id="char-reset" class="reset-btn" title="重置筛选">重置</button>
      </div>
      <div id="char-tag-chips" class="tagbar"></div>
      <div id="char-skill-chips" class="tagbar"></div>
      <div id="char-count" class="result-count"></div>
      <div class="list-head chars">
        <span><button class="sort-th" data-kind="characters" data-sort="name">名称</button></span>
        <span><button class="sort-th" data-kind="characters" data-sort="rarity">稀有度</button></span>
        <span><button class="sort-th" data-kind="characters" data-sort="role">类型</button></span>
        <span><button class="sort-th" data-kind="characters" data-sort="ranged">射击</button></span>
        <span><button class="sort-th" data-kind="characters" data-sort="melee">格斗</button></span>
        <span><button class="sort-th" data-kind="characters" data-sort="defense">防御</button></span>
        <span><button class="sort-th" data-kind="characters" data-sort="awaken">觉醒</button></span>
        <span><button class="sort-th" data-kind="characters" data-sort="reaction">反应</button></span>
        <span><button class="sort-th" data-kind="characters" data-sort="support">支援次数</button></span>
      </div>
      <div id="char-list" class="list chars"></div>
      <div id="char-pager" class="pager"></div>
    </section>

    <section id="tab-supporters" class="tab" role="tabpanel" aria-label="支援角色">
      <div class="toolbar">
        <input id="sup-q" placeholder="搜索支援角色名称 / 词条标签…" aria-label="搜索支援角色">
        <div class="sbox" id="sup-tag-box">
          <input class="sbox-input" placeholder="搜索/添加词条标签…" autocomplete="off" aria-label="搜索或添加词条标签">
          <div class="sbox-list hidden"></div>
        </div>
        <select id="sup-tag-mode" aria-label="标签匹配模式">
          <option value="any" selected>含任一标签</option>
          <option value="all">含全部标签</option>
        </select>
        <div class="sbox" id="sup-skill-box">
          <input class="sbox-input" placeholder="搜索/添加主动技…" autocomplete="off" aria-label="搜索或添加主动技">
          <div class="sbox-list hidden"></div>
        </div>
        <select id="sup-skill-mode" aria-label="主动技匹配模式">
          <option value="any" selected>含任一主动技</option>
          <option value="all">含全部主动技</option>
        </select>
        <button id="sup-search">查询</button>
        <button id="sup-reset" class="reset-btn" title="重置筛选">重置</button>
      </div>
      <div id="sup-tag-chips" class="tagbar"></div>
      <div id="sup-skill-chips" class="tagbar"></div>
      <div id="sup-count" class="result-count"></div>
      <div class="list-head sups">
        <span><button class="sort-th" data-kind="supporters" data-sort="name">名称</button></span>
        <span><button class="sort-th" data-kind="supporters" data-sort="rarity">稀有度</button></span>
        <span><button class="sort-th" data-kind="supporters" data-sort="conds">词条对象</button></span>
        <span><button class="sort-th" data-kind="supporters" data-sort="skill">主动技</button></span>
        <span><button class="sort-th" data-kind="supporters" data-sort="hp">HP 加成</button></span>
        <span><button class="sort-th" data-kind="supporters" data-sort="atk">攻击加成</button></span>
        <span><button class="sort-th" data-kind="supporters" data-sort="route">获取途径</button></span>
      </div>
      <div id="sup-list" class="list"></div>
      <div id="sup-pager" class="pager"></div>
    </section>

    <section id="tab-search" class="tab" role="tabpanel" aria-label="技能/能力/效果搜索">
      <div class="toolbar">
        <select id="sr-type" aria-label="搜索类型">
          <option value="skill">技能</option>
          <option value="ability">能力</option>
          <option value="weapon">武装效果</option>
        </select>
        <select id="sr-kind" aria-label="搜索范围">
          <option value="all">机体 + 驾驶员</option>
          <option value="unit">仅机体</option>
          <option value="character">仅驾驶员</option>
        </select>
        <input id="sr-q" placeholder="搜索名称 / 效果文本…" aria-label="搜索名称或效果文本">
        <button id="sr-search">查询</button>
        <button id="sr-reset" class="reset-btn" title="重置">重置</button>
      </div>
      <div id="sr-count" class="result-count"></div>
      <div class="list-head sr">
        <span><button class="sort-th" data-kind="search" data-sort="name">名称</button></span>
        <span><button class="sort-th" data-kind="search" data-sort="owner">持有者</button></span>
        <span><button class="sort-th" data-kind="search" data-sort="series">类型 / 系列</button></span>
        <span><button class="sort-th" data-kind="search" data-sort="effect">效果</button></span>
      </div>
      <div id="sr-result" class="list sr"></div>
      <div id="sr-pager" class="pager"></div>
    </section>

    <section id="tab-stages" class="tab" role="tabpanel" aria-label="关卡敌人">
      <div class="toolbar">
        <input id="stage-q" placeholder="搜索关卡名称 / ID…" aria-label="搜索关卡名称或ID">
        <button id="stage-search">查询</button>
        <button id="stage-reset" class="reset-btn" title="重置筛选">重置</button>
      </div>
      <div id="stage-count" class="result-count"></div>
      <div class="list-head stages">
        <span>ID</span><span>名称</span><span>类型</span><span>CP</span><span>AP</span><span>敌方单位</span>
      </div>
      <div id="stage-list" class="list"></div>
      <div id="stage-pager" class="pager"></div>
    </section>

    <section id="tab-damage" class="tab" role="tabpanel" aria-label="伤害计算">
      <div class="calc-wrap">
        <div class="calc-side">
          <h3 class="side-title">攻击方 <button type="button" class="reset-btn small" id="reset-atk">重置</button></h3>
          <div class="pick-btns">
            <button type="button" class="pick-btn" id="pick-atk-unit">选择机体</button>
            <button type="button" class="pick-btn" id="pick-atk-uskill">选择机体单位技能</button>
            <button type="button" class="pick-btn" id="pick-weapon">选择武器</button>
            <button type="button" class="pick-btn" id="pick-atk-pilot">选择驾驶员</button>
            <button type="button" class="pick-btn" id="pick-atk-skill">选择驾驶员技能</button>
            <button type="button" class="pick-btn" id="pick-atk-support">选择支援角色</button>
          </div>
          <div class="pick-infos">
            <div class="pick-info" id="atk-unit-info"></div>
            <div class="pick-info" id="atk-pilot-info"></div>
          </div>
          <select id="atk-unit-star" class="star-select hidden" aria-label="攻击方机体星级">
            <option value="0">0★</option>
            <option value="1">1★</option>
            <option value="2">2★</option>
            <option value="3">3★</option>
          </select>
          <div class="stat-row">
            <label>机体攻击 <input id="d-aua" type="number" value="3000"></label>
            <label>驾驶员攻击 <input id="d-aca" type="number" value="800"></label>
          </div>
          <div class="panel-row">
            <span id="atk-support-info" class="pick-info">未选择支援角色</span>
            <label>星级 <select id="atk-support-star">
              <option value="0">0★</option><option value="1">1★</option>
              <option value="2">2★</option><option value="3" selected>3★</option>
            </select></label>
            <label>能力提升% <input id="atk-support" type="number" value="0"></label>
            <label>攻击力提升 <input id="atk-fixed" type="number" value="0"></label>
            <label>HP提升 <input id="atk-support-hp" type="number" value="0"></label>
          </div>
          <div class="panel-row">
            <span>零件</span>
            <label>HP <input id="atk-op-hp" type="number" value="0"><select id="atk-op-hp-mode"><option value="pct" selected>%</option><option value="num">数值</option></select></label>
            <label>攻击 <input id="atk-op-atk" type="number" value="0"><select id="atk-op-atk-mode"><option value="pct" selected>%</option><option value="num">数值</option></select></label>
            <label>防御 <input id="atk-op-def" type="number" value="0"><select id="atk-op-def-mode"><option value="pct" selected>%</option><option value="num">数值</option></select></label>
          </div>
          <label class="ab-head">机体的单位能力</label>
          <div id="atk-unit-ab" class="ability-list"></div>
          <label class="ab-head">驾驶员的角色能力</label>
          <div id="atk-pilot-ab" class="ability-list"></div>
          <div id="d-atk-uskills" class="tagbar"></div>
          <div id="d-atk-skills" class="tagbar"></div>
          <label class="ab-head">武器</label>
          <div class="weapon-info">
            <span>已选 <b id="d-weapon-name">—</b></span>
            <span>威力 <input id="d-wp" type="number" value="5000" aria-label="武器威力"></span>
            <span>威力特效 <span id="d-wfx-power">—</span></span>
            <span>类型 <span id="d-wtype">—</span></span>
            <span>依赖 <span id="d-wstat">—</span></span>
            <span>暴击率 <span id="d-wcrit">—</span></span>
            <span>暴击伤害 <span id="d-wcritdmg">—</span></span>
          </div>
          <label>战意
            <select id="d-vigor-atk">
              <option value="normal" selected>一般</option>
              <option value="high">强势 (+10%)</option>
              <option value="max">超强势 (+20%)</option>
              <option value="supercharged">超一击 (+30%)</option>
            </select>
          </label>
        </div>
        <div class="calc-side">
          <h3 class="side-title">防御方 <button type="button" class="reset-btn small" id="reset-def">重置</button></h3>
          <div class="pick-btns">
            <button type="button" class="pick-btn" id="pick-def-unit">选择机体</button>
            <button type="button" class="pick-btn" id="pick-def-uskill">选择机体单位技能</button>
            <button type="button" class="pick-btn" id="pick-def-pilot">选择驾驶员</button>
            <button type="button" class="pick-btn" id="pick-def-skill">选择驾驶员技能</button>
            <button type="button" class="pick-btn" id="pick-def-support">选择支援角色</button>
          </div>
          <div class="pick-infos">
            <div class="pick-info" id="def-unit-info"></div>
            <div class="pick-info" id="def-pilot-info"></div>
          </div>
          <select id="def-unit-star" class="star-select hidden" aria-label="防御方机体星级">
            <option value="0">0★</option>
            <option value="1">1★</option>
            <option value="2">2★</option>
            <option value="3">3★</option>
          </select>
          <div class="stat-row">
            <label>机体防御 <input id="d-dud" type="number" value="2800"></label>
            <label>机体HP <input id="d-dhp" type="number" value="0"></label>
            <label>驾驶员防御 <input id="d-dcd" type="number" value="750"></label>
          </div>
          <div class="panel-row">
            <span id="def-support-info" class="pick-info">未选择支援角色</span>
            <label>星级 <select id="def-support-star">
              <option value="0">0★</option><option value="1">1★</option>
              <option value="2">2★</option><option value="3" selected>3★</option>
            </select></label>
            <label>能力提升% <input id="def-support" type="number" value="0"></label>
            <label>攻击力提升 <input id="def-support-atk" type="number" value="0"></label>
            <label>HP提升 <input id="def-support-hp" type="number" value="0"></label>
          </div>
          <div class="panel-row">
            <span>零件</span>
            <label>HP <input id="def-op-hp" type="number" value="0"><select id="def-op-hp-mode"><option value="pct" selected>%</option><option value="num">数值</option></select></label>
            <label>攻击 <input id="def-op-atk" type="number" value="0"><select id="def-op-atk-mode"><option value="pct" selected>%</option><option value="num">数值</option></select></label>
            <label>防御 <input id="def-op-def" type="number" value="0"><select id="def-op-def-mode"><option value="pct" selected>%</option><option value="num">数值</option></select></label>
          </div>
          <label class="ab-head">机体的单位能力</label>
          <div id="def-unit-ab" class="ability-list"></div>
          <label class="ab-head">驾驶员的角色能力</label>
          <div id="def-pilot-ab" class="ability-list"></div>
          <div id="d-def-uskills" class="tagbar"></div>
          <div id="d-def-skills" class="tagbar"></div>
          <label>战意
            <select id="d-vigor-def">
              <option value="normal" selected>一般</option>
              <option value="high">强势 (+10%)</option>
              <option value="max">超强势 (+20%)</option>
              <option value="supercharged">超一击 (+30%)</option>
            </select>
          </label>
          <h3>修正</h3>
          <div class="mods-grid">
            <label>地形倍率 <input id="d-terrain" type="number" step="0.1" value="1.0"></label>
            <label>增伤 % <input id="d-buff" type="number" value="0"></label>
            <label>敌方减伤 % <input id="d-debuff" type="number" value="0"></label>
            <label>暴击 <input id="d-crit" type="checkbox"></label>
            <label>防御状态
              <select id="d-defend-state">
                <option value="none" selected>无防御 (×1.0)</option>
                <option value="defend">防御·无盾 (×0.8)</option>
                <option value="defend_shield">防御·有盾 (×0.6)</option>
              </select>
            </label>
          </div>
        </div>
        <div id="d-result" class="calc-result">
          <div class="calc-result-head">
            <button id="d-calc" class="primary">计算伤害</button>
          </div>
          <div id="d-result-body"></div>
        </div>
      </div>
    </section>

    <section id="tab-pairing" class="tab" role="tabpanel" aria-label="配对">
      <div class="pair-panel">
        <div class="pair-head">
          <span class="pair-title">机体 → 驾驶员 配对</span>
          <span id="pair-msg" class="muted"></span>
        </div>
        <div class="pair-row">
          <span class="pair-label">机体</span>
          <button id="pair-select-unit" class="cond-btn">选择机体</button>
          <div id="pair-selected" class="pair-selected"><span class="muted">未选择机体</span></div>
        </div>
        <div class="pair-row">
          <span class="pair-label">行动</span>
          <div class="seg">
            <button id="pair-act-atk" class="seg-btn active">攻击</button>
            <button id="pair-act-def" class="seg-btn">防御</button>
          </div>
          <span id="pair-bench-wrap">
            <span class="pair-label pair-label-gap">防御基准</span>
            <span class="seg">
              <button id="pair-bench-low" class="seg-btn active">低防本</button>
              <button id="pair-bench-mid" class="seg-btn">中防本</button>
            </span>
          </span>
          <span id="pair-vigor-wrap">
            <span class="pair-label pair-label-gap">战意</span>
            <select id="pair-vigor">
              <option value="normal" selected>一般</option>
              <option value="high">强势 (+10%)</option>
              <option value="max">超强势 (+20%)</option>
              <option value="supercharged">超一击 (+30%)</option>
            </select>
          </span>
          <button id="pair-match" class="cond-btn pair-match-btn" disabled>匹配驾驶员</button>
        </div>
        <div id="pair-ext-row" class="pair-row">
          <span class="pair-label">外部加成</span>
          <label class="pair-field" id="pair-ext-sup-lbl">支援/船舰%
            <input id="pair-ext-sup" type="number" value="0" min="0">
          </label>
          <label class="pair-field" id="pair-ext-op-lbl">零件攻击%
            <input id="pair-ext-op" type="number" value="0" min="0">
          </label>
          <label class="pair-field">固定值
            <input id="pair-ext-fixed" type="number" value="0" min="0">
          </label>
          <label class="pair-field hidden" id="pair-ext-hp-lbl">零件HP%
            <input id="pair-ext-hp" type="number" value="0" min="0">
          </label>
          <label class="pair-field hidden" id="pair-ext-hpf-lbl">HP固定
            <input id="pair-ext-hpf" type="number" value="0" min="0">
          </label>
        </div>
        <div id="pair-weapon-row" class="pair-row hidden">
          <span class="pair-label">武器</span>
          <button id="pair-select-weapon" class="cond-btn">选择武器</button>
          <button id="pair-select-uskill" class="cond-btn" title="选择机体单位技能（主动技，可选发动）">选择单位技能</button>
          <span id="pair-uskill-chips" class="chips"></span>
          <div id="pair-weapon-info" class="pair-weapon-info"><span class="muted">未选择武器</span></div>
        </div>
        <div id="pair-enemy-row" class="pair-row hidden">
          <span class="pair-label">敌方</span>
          <label class="pair-field">机体攻击
            <input id="pair-enemy-ua" type="number" value="15000" min="0">
          </label>
          <label class="pair-field">驾驶员攻击
            <input id="pair-enemy-pa" type="number" value="800" min="0">
          </label>
          <label class="pair-field">武器威力
            <input id="pair-enemy-wp" type="number" value="5000" min="0">
            <span class="muted">×</span>
            <input id="pair-enemy-wpboost" type="number" value="0" min="0" title="武装POWER提升 %">
            <span class="muted">= <b id="pair-enemy-wpeff">5000</b></span>
          </label>
          <span id="pair-enemy-wp-fx" class="muted"></span>
          <label class="pair-field">武器类型
            <select id="pair-enemy-wt">
              <option value="1">实弹</option>
              <option value="2" selected>光束</option>
              <option value="3">特殊</option>
              <option value="6">EX（多伤害集合）</option>
            </select>
          </label>
          <label class="pair-field">依赖属性
            <select id="pair-enemy-waa">
              <option value="any">任意</option>
              <option value="Ranged" selected>射击</option>
              <option value="Melee">格斗</option>
              <option value="Awaken">觉醒</option>
            </select>
          </label>
          <label class="pair-field">防御状态
            <select id="pair-enemy-guard">
              <option value="2" selected>按防御且带盾</option>
              <option value="1">防御不带盾</option>
              <option value="0">不防御</option>
            </select>
          </label>
          <label class="pair-field">敌方战意
            <select id="pair-enemy-vigor">
              <option value="normal" selected>一般</option>
              <option value="high">强势 (+10%)</option>
              <option value="max">超强势 (+20%)</option>
              <option value="supercharged">超一击 (+30%)</option>
            </select>
          </label>
          <label class="pair-field">地形倍率
            <input id="pair-enemy-terrain" type="number" step="0.1" value="1.0" min="0">
          </label>
          <label class="pair-field">敌方暴击率%
            <input id="pair-enemy-crit" type="number" value="0" min="0" max="100">
          </label>
          <button id="pair-enemy-default" class="cond-btn" title="使用默认敌方：能天使高达(EX) 满星满级 + 刹那·F·清英 + GN剑 EX">默认敌人</button>
          <button id="pair-enemy-tags-btn" class="cond-btn" title="选择敌方机体标签/系列，用于判定针对敌方的能力">选择敌人标签</button>
          <span id="pair-enemy-tags" class="chips"></span>
          <label class="pair-field pair-field-check">
            <input id="pair-enemy-ir" type="checkbox"> 敌方武器含「武装属性损伤减轻无效」
          </label>
        </div>
      </div>
      <div id="pair-result"></div>
    </section>
  </main>

  <footer>数据来源 <a href="https://soshage.com/gget/" target="_blank" rel="noopener" aria-label="数据来源网站 soshage.com（在新标签页打开）">soshage.com/gget</a>（zh-CN）· 仅供个人研究</footer>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head"><span id="modal-title"></span><button id="modal-close" aria-label="关闭对话框">×</button></div>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="pair-picker-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head"><span>选择机体</span><button id="pair-picker-close" aria-label="关闭对话框">×</button></div>
      <div class="toolbar">
        <input id="pp-q" placeholder="搜索机体名称…" aria-label="搜索机体名称">
        <select id="pp-rarity" aria-label="稀有度筛选">
          <option value="">全部稀有度</option>
          <option value="5">UR</option>
          <option value="4">SSR</option>
          <option value="3">SR</option>
          <option value="2">R</option>
          <option value="1">N</option>
        </select>
        <select id="pp-acq" aria-label="获取途径筛选">
          <option value="">全部获取途径</option>
          <option value="1">扭蛋</option>
          <option value="other">其他</option>
        </select>
        <div class="sbox" id="pp-series-box">
          <input class="sbox-input" placeholder="搜索系列…" autocomplete="off" aria-label="搜索系列">
          <div class="sbox-list hidden"></div>
          <button class="sbox-clear hidden" type="button" title="清除" aria-label="清除系列筛选">×</button>
        </div>
        <select id="pp-type" aria-label="类型筛选">
          <option value="">全部类型</option>
          <option value="1">攻击型</option>
          <option value="2">耐久型</option>
          <option value="3">支援型</option>
        </select>
        <div class="sbox" id="pp-tag-box">
          <input class="sbox-input" placeholder="搜索/添加标签…" autocomplete="off" aria-label="搜索或添加标签">
          <div class="sbox-list hidden"></div>
        </div>
        <select id="pp-tag-mode" aria-label="标签匹配模式">
          <option value="all">含全部标签</option>
          <option value="any">含任一标签</option>
        </select>
        <select id="pp-match" aria-label="筛选条件匹配模式">
          <option value="and">交集（全部满足）</option>
          <option value="or">并集（任一满足）</option>
        </select>
        <div class="sbox" id="pp-wfx-box">
          <input class="sbox-input" placeholder="搜索/添加武器特效…" autocomplete="off" aria-label="搜索或添加武器特效">
          <div class="sbox-list hidden"></div>
        </div>
        <select id="pp-wfx-mode" aria-label="武器特效匹配模式">
          <option value="any" selected>含任一特效</option>
          <option value="all">含全部特效</option>
        </select>
        <button id="pp-search">查询</button>
        <button id="pp-reset" class="reset-btn" title="重置筛选">重置</button>
      </div>
      <div id="pp-tag-chips" class="tagbar"></div>
      <div id="pp-wfx-chips" class="tagbar"></div>
      <div id="pp-count" class="result-count"></div>
      <div class="list-head units">
        <span>名称</span><span>稀有度</span><span>类型</span><span>攻击</span><span>防御</span><span>机动</span><span>HP</span><span>EN</span><span>移动</span>
      </div>
      <div id="pp-list" class="list units"></div>
      <div id="pp-pager" class="pager"></div>
    </div>
  </div>

  <div id="enemy-picker-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head"><span>选择敌人标签 / 系列</span><button id="enemy-picker-close" aria-label="关闭对话框">×</button></div>
      <div class="toolbar">
        <div class="sbox" id="ep-series-box">
          <input class="sbox-input" placeholder="搜索系列…" autocomplete="off" aria-label="搜索系列">
          <div class="sbox-list hidden"></div>
          <button class="sbox-clear hidden" type="button" title="清除" aria-label="清除系列筛选">×</button>
        </div>
        <div class="sbox" id="ep-tag-box">
          <input class="sbox-input" placeholder="搜索/添加标签…" autocomplete="off" aria-label="搜索或添加标签">
          <div class="sbox-list hidden"></div>
        </div>
      </div>
      <div id="ep-chips" class="tagbar"></div>
      <div class="calc-actions">
        <button id="ep-ok" class="cond-btn">确定</button>
        <button id="ep-clear" class="cond-btn">清除</button>
        <button id="ep-cancel" class="cond-btn">取消</button>
      </div>
    </div>
  </div>

  <div id="picker-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head"><span id="picker-title"></span><button id="picker-close" aria-label="关闭对话框">×</button></div>
      <div class="toolbar">
        <select id="picker-source" aria-label="选择来源">
          <option value="library">机体库</option>
          <option value="enemy">关卡敌人</option>
        </select>
        <input id="picker-q" placeholder="搜索名称…" aria-label="搜索名称">
        <select id="picker-rarity" class="picker-filter hidden" aria-label="稀有度筛选">
          <option value="">全部稀有度</option>
          <option value="5">UR</option>
          <option value="4">SSR</option>
          <option value="3">SR</option>
          <option value="2">R</option>
          <option value="1">N</option>
        </select>
        <select id="picker-type" class="picker-filter hidden" aria-label="类型筛选">
          <option value="">全部类型</option>
          <option value="1">攻击型</option>
          <option value="2">耐久型</option>
          <option value="3">支援型</option>
        </select>
        <div class="sbox picker-filter hidden" id="picker-series-box">
          <input class="sbox-input" placeholder="搜索系列…" autocomplete="off" aria-label="搜索系列">
          <div class="sbox-list hidden"></div>
          <button class="sbox-clear hidden" type="button" title="清除" aria-label="清除系列筛选">×</button>
        </div>
        <div class="sbox picker-filter hidden" id="picker-tag-box">
          <input class="sbox-input" placeholder="搜索标签…" autocomplete="off" aria-label="搜索标签">
          <div class="sbox-list hidden"></div>
          <button class="sbox-clear hidden" type="button" title="清除" aria-label="清除标签筛选">×</button>
        </div>
        <button id="picker-search">查询</button>
        <button id="picker-reset" class="reset-btn" title="重置筛选">重置</button>
      </div>
      <div id="picker-list" class="list picker-list"></div>
      <div id="picker-pager" class="pager"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
